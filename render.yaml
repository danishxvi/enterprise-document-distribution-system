# Render blueprint for the backend API only. The frontend is hosted on Netlify,
# and MySQL is provided by an external free tier database such as Aiven, since
# Render's own managed database is PostgreSQL rather than MySQL.
#
# Import this from the Render dashboard, then fill in the database values it
# marks as required (DB_URL, DB_USERNAME, DB_PASSWORD).

services:
  - type: web
    name: edds-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      # JDBC url for your external MySQL, for example:
      # jdbc:mysql://HOST:PORT/DBNAME?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EDDS_JWT_SECRET
        generateValue: true
      # The deployed Netlify frontend origin allowed to call this API.
      - key: EDDS_CORS_ORIGINS
        value: https://ddep.netlify.app
