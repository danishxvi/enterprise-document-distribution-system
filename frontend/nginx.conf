server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app: unknown paths fall back to index.html so client side
    # routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend service defined in docker compose.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be a few megabytes, so lift the default body limit.
        client_max_body_size 12m;
    }

    # Long cache for fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
